version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # Default linters (gosimple is part of staticcheck in v2)
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Additional useful linters
    - misspell
    - gosec
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - os.Remove
        - os.RemoveAll
    gosec:
      excludes:
        - G104 # Unhandled errors (covered by errcheck)
        - G304 # File path from variable (often intentional in CLIs)
    misspell:
      locale: US
  exclusions:
    rules:
      # Allow unused parameters in test helpers
      - path: _test\.go
        linters:
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/OWNER/REPO
